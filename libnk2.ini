[project]
name: "libnk2"
status: "alpha"
year_of_creation: "2009"
data_format: "Microsoft Outlook Nickfile (NK2)"
documentation_url: "https://github.com/libyal/libnk2/tree/main/documentation"
features: ["debug_output", "ossfuzz", "python_bindings", "tools"]

[library]
description: "Library to access the Nickfile (NK2) format"
features: ["pthread", "wide_character_type"]
public_types: ["file", "item", "record_entry"]
tests: ["error", "file_footer", "file_header", "io_handle", "item", "mapi_value", "notify", "record_entry"]
tests_with_input: ["file", "support"]

[python_module]
tests: ["support"]
tests_with_input: ["file"]

[tools]
description: "Several tools for reading Nickfiles (NK2)"
names: ["nk2export", "nk2info"]
tests: ["info_handle", "output", "signal"]

[troubleshooting]
example: "nk2info Outlook.NK2"

[test_data]
repository: "log2timeline/plaso"
files: ["Outlook.NK2"]

[tests]
profiles: ["libnk2", "pynk2", "nk2export", "nk2info"]
options_per_profile: ["", "", "", ""]
export_tool_profiles: ["nk2export"]
info_tool_profiles: ["nk2info"]
example_filename1: "Outlook.NK2"
example_filename2: "Outlook1.NK2"

